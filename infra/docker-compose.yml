services:
  coturn:
    image: coturn/coturn:4.6
    container_name: peertalk-coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --lt-cred-mech
      --realm=peertalk.local
      --user=peertalk:peertalk
      --fingerprint
      --no-multicast-peers
      --no-cli
      --listening-port=3478

  signaling:
    build:
      context: ../server
      dockerfile: ../infra/server.Dockerfile
    container_name: peertalk-signaling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      CORS_ORIGIN: "http://localhost:3000"
